name: MTA — 30s vs 60s Comparison v0.5

on:
  push:
    branches: [development]
    paths:
      - 'compare_polling.py'
      - '.github/workflows/mta-pilot30-comparison.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out development
        uses: actions/checkout@v4
        with:
          ref: development
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run baseline and comparison tests
        run: |
          python arrival_departure_pilot.py --self-test
          python compare_polling.py --self-test

      - name: Install R2 client
        run: python -m pip install 'boto3>=1.34,<2'

      - name: Read two-hour pilot and compare equal-time series
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python compare_polling.py --out pilot30-comparison.json

      - name: Upload research report even if no pilot samples yet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mta-pilot30-comparison-v05
          path: pilot30-comparison.json
          retention-days: 7
          if-no-files-found: warn
