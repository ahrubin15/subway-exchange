
name: MTA — Arrival Evidence Research v0.2

on:
  push:
    branches: [development]
    paths:
      - 'arrival_evidence.py'
      - '.github/workflows/mta-arrival-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-research:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out development
        uses: actions/checkout@v4
        with:
          ref: development
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run evidence tests
        run: |
          python arrival_candidates.py --self-test
          python arrival_evidence.py --self-test

      - name: Install R2 client
        run: python -m pip install 'boto3>=1.34,<2'

      - name: Analyze live archive
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python arrival_evidence.py --minutes 90 --max-snapshots 120 --out arrival-evidence.json

      - name: Save report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mta-arrival-evidence-v02
          path: arrival-evidence.json
          retention-days: 7
          if-no-files-found: warn
