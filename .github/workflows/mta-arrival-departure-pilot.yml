name: MTA — Line 6 Arrival and Departure Pilot v0.4

on:
  push:
    branches: [development]
    paths:
      - 'arrival_departure_pilot.py'
      - '.github/workflows/mta-arrival-departure-pilot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out development
        uses: actions/checkout@v4
        with:
          ref: development
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run arrival / departure pilot unit tests
        run: python arrival_departure_pilot.py --self-test
      - name: Install private R2 client
        run: python -m pip install 'boto3>=1.34,<2'
      - name: Read existing 60-second archive, line 6 pilot only
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python arrival_departure_pilot.py --minutes 90 --max-snapshots 120 --out arrival-departure-pilot.json
      - name: Save research report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mta-arrival-departure-pilot-v04
          path: arrival-departure-pilot.json
          retention-days: 7
          if-no-files-found: warn
