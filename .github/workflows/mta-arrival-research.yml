
name: MTA — Arrival Candidate Research

on:
  push:
    branches: [development]
    paths:
      - 'arrival_candidates.py'
      - '.github/workflows/mta-arrival-research.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-trains:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out development branch
        uses: actions/checkout@v4
        with:
          ref: development
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run seven synthetic safety tests
        run: python arrival_candidates.py --self-test

      - name: Install private R2 read client
        run: python -m pip install 'boto3>=1.34,<2'

      - name: Analyze last 90 minutes of numbered-line feed
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python arrival_candidates.py --minutes 90 --max-snapshots 120 --out arrival-report.json

      - name: Preserve research report for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mta-arrival-research
          path: arrival-report.json
          retention-days: 7
          if-no-files-found: warn
