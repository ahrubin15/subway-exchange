
name: MTA — Archive Quality Report

on:
  push:
    branches: [development]
    paths:
      - 'quality_report.py'
      - '.github/workflows/mta-quality-report.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-archives:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out development
        uses: actions/checkout@v4
        with:
          ref: development
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run quality tests
        run: python quality_report.py --self-test

      - name: Install R2 client
        run: python -m pip install 'boto3>=1.34,<2'

      - name: Analyze archived observations
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python quality_report.py --hours 24 --out quality-report.json

      - name: Save report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mta-quality-report
          path: quality-report.json
          retention-days: 14
          if-no-files-found: warn
