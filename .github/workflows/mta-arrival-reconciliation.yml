name: MTA — Arrival Reconciliation Research v0.3

on:
  push:
    branches: [development]
    paths:
      - 'arrival_reconcile.py'
      - '.github/workflows/mta-arrival-reconciliation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconcile-arrival-signals:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out development
        uses: actions/checkout@v4
        with:
          ref: development
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run previous and new synthetic tests
        run: |
          python arrival_candidates.py --self-test
          python arrival_reconcile.py --self-test

      - name: Install private R2 read client
        run: python -m pip install 'boto3>=1.34,<2'

      - name: Reconcile signals from last 90 minutes
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python arrival_reconcile.py --minutes 90 --max-snapshots 120 --out arrival-reconciliation.json

      - name: Save research report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mta-arrival-reconciliation-v03
          path: arrival-reconciliation.json
          retention-days: 7
          if-no-files-found: warn
