name: PostgreSQL Ledger — Concurrency and Privileges v0.3
on:
  push:
    branches: [development]
    paths:
      - '0001_core_schema.sql'
      - '0002_internal_ledger.sql'
      - 'pg_concurrency_tests.py'
      - '.github/workflows/postgres-concurrency.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  database-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: subway_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_only_local_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d subway_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PG_TEST_DSN: postgresql://postgres:test_only_local_password@localhost:5432/subway_test
      PGPASSWORD: test_only_local_password
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test-only PostgreSQL client
        run: python -m pip install 'psycopg[binary]>=3.2,<4'
      - name: Initialize disposable database
        run: |
          psql -h localhost -U postgres -d subway_test -v ON_ERROR_STOP=1 -f 0001_core_schema.sql
          psql -h localhost -U postgres -d subway_test -v ON_ERROR_STOP=1 -f 0002_internal_ledger.sql
      - name: Run real concurrency and permission tests
        run: python pg_concurrency_tests.py
