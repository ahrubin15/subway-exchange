<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Subway Exchange | Founder</title>
<style>
:root{color-scheme:dark;--bg:#101822;--panel:#192532;--border:#334354;--muted:#a5b6c8;--green:#55d49a;--yellow:#ffcb23}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f4f7fa;font:15px/1.5 system-ui,-apple-system,sans-serif}main{max-width:1000px;padding:24px 16px 48px;margin:auto}header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--border);padding-bottom:16px}h1,h2,p{margin:0}h1{font-size:24px}h2{font-size:17px;margin:24px 0 10px}.brand{display:flex;align-items:center;gap:10px}.roundel{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:#00933c;color:#fff;font-size:23px;font-weight:800}.muted,small{color:var(--muted)}a{color:var(--yellow)}button,select{font:inherit;background:var(--panel);color:inherit;border:1px solid var(--border);border-radius:8px;padding:9px 12px}button{cursor:pointer}button:disabled{opacity:.5;cursor:default}button:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid var(--yellow);outline-offset:3px}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:10px}.metric,.panel{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px}.metric small,.metric strong{display:block}.metric strong{font-size:25px;line-height:1.2;margin:7px 0;font-variant-numeric:tabular-nums}.good{color:var(--green)}.warn{color:var(--yellow)}.bad{color:#ff8989}.row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--border)}.row:last-child{border:0}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:9px;border-bottom:1px solid var(--border);white-space:nowrap}th{color:var(--muted)}.bar{height:7px;border-radius:5px;background:#354554;margin-top:10px;overflow:hidden}.bar span{display:block;background:var(--green);height:100%}.notice{padding:12px;border:1px solid var(--border);border-radius:8px;margin:16px 0}.hidden,[hidden]{display:none!important}footer{margin-top:25px;color:var(--muted);font-size:12px}@media(max-width:420px){main{padding:16px 12px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.metric{padding:10px}.metric strong{font-size:21px}}
</style></head><body><main><header><div class="brand"><span class="roundel">6</span><div><h1>Founder Dashboard</h1><small>Subway Exchange · Private alpha</small></div></div><a href="./?live=1">Back to Game</a></header><div id="status" class="notice" role="status">Checking founder access…</div><div id="dashboard" hidden><div class="controls"><label for="period">Reporting period</label><select id="period"><option value="1">Last hour</option><option value="6">Last 6 hours</option><option value="24" selected>Last 24 hours</option><option value="168">Last 7 days</option></select><button id="refresh">Refresh</button><small id="asof"></small></div><div id="metrics"></div><footer>Research outcomes are experimental. V3 candidate outcomes are not player settlements. Cloudflare billing is not yet connected. No automatic refresh or operational controls on this read-only page.</footer></div></main>
<script type="module">
const $=id=>document.getElementById(id),status=$('status'),dashboard=$('dashboard'),metrics=$('metrics');
const num=v=>v==null?'—':Number(v).toLocaleString('en-US',{maximumFractionDigits:1});
const pct=(a,b)=>b>0?(100*a/b).toFixed(1)+'%':'—';
const mb=v=>v==null?'—':num(v/1e6)+' MB';
const duration=v=>v==null?'—':v>=60?Math.floor(v/60)+'m '+Math.round(v%60)+'s':num(v)+'s';
const clock=v=>v?new Date(v).toLocaleString('en-US',{timeZone:'America/New_York',dateStyle:'short',timeStyle:'medium'})+' ET':'—';
function el(tag,text,cls){const x=document.createElement(tag);if(text!=null)x.textContent=String(text);if(cls)x.className=cls;return x;}
function section(title){const s=el('section');s.append(el('h2',title));metrics.append(s);return s;}
function cards(s,items){const g=el('div',null,'grid');for(const [label,value,note,cls] of items){const c=el('div',null,'metric');c.append(el('small',label),el('strong',value,cls),el('small',note));g.append(c);}s.append(g);}
function rows(s,items){const p=el('div',null,'panel');for(const [label,value] of items){const r=el('div',null,'row');r.append(el('span',label,'muted'),el('strong',value));p.append(r);}s.append(p);}
function table(s,headers,data){const wrap=el('div',null,'panel table-wrap'),t=el('table'),head=el('thead'),tr=el('tr');for(const v of headers)tr.append(el('th',v));head.append(tr);t.append(head);const body=el('tbody');for(const item of data){const r=el('tr');for(const v of item)r.append(el('td',v));body.append(r);}t.append(body);wrap.append(t);s.append(wrap);}
function render(d){metrics.replaceChildren();$('asof').textContent='Updated '+clock(d.as_of);const f=d.feed||{},e=d.engine||{},s=d.settlement||{},t=d.timing||{},db=d.storage||{},r=d.retention||{},g=d.gameplay||{};
cards(section('Engine Overview'),[['Engine success',pct(e.successful,e.runs),num(e.runs)+' runs',e.errors===0?'good':'warn'],['V1 void rate',pct(s.v1_voids,s.markets),num(s.v1_voids)+' voids'],['V2 void rate',pct(s.v2_voids,s.markets),num(s.v2_voids)+' voids'],['V3 candidate void rate',pct(s.v3_candidate_voids,s.markets),num(s.v3_candidate_rescues)+' additional rescues'],['Shadow trading window',duration(t.average_locked_window_seconds),num(t.locked)+' locked markets'],['Settlement latency',duration(s.median_latency_seconds),'Median after deadline']]);
cards(section('Feed & Collection'),[['Feed observations',num(f.samples),num(f.healthy)+' healthy'],['Median interval',duration(f.median_gap_seconds),'Across selected period'],['Median feed age',duration(f.median_age_seconds),'Source to collection'],['Repeated timestamps',f.samples==null?'—':num(f.samples-f.unique_source_times),'Not necessarily duplicate payloads'],['Repeated hashes',f.samples==null?'—':num(f.samples-f.unique_hashes),'Exact payload repeats'],['Route movement rows',num(d.route_movement_count),'All retained'],['Trip-service snapshots',num(d.trip_service_count),'All retained']]);
rows(section('Market Timing'),[['Shadow markets',num(t.markets)],['Early locks',num(t.early_locks)],['Latest feed',clock(f.latest_at)],['Latest successful engine run',clock(e.latest_success_at)]]);
const st=section('Infrastructure & Retention');cards(st,[['Supabase database',mb(db.database_bytes),db.status||'Unknown',db.status==='OK'?'good':'warn'],['Train observation storage',mb(db.train_observation_bytes),'Normalized observations'],['Archived settlements',num(d.archive_count),'All retained'],['Removed observations',num(d.removed_rows),'All retention batches']]);rows(st,[['Retention enabled',r.enabled?'Yes':'No'],['Last successful cleanup',clock(r.last_success_at)],['Last cleanup error',r.last_error||'None reported'],['Cloudflare usage','Not connected']]);
cards(section('Gameplay'),[['Verified accounts',num(g.verified_accounts),'All time'],['Active verified players',num(g.active_verified_players),'Selected period'],['Verified predictions',num(g.verified_predictions),'Selected period'],['Wallet discrepancies',num(g.wallet_mismatches),'All wallets',g.wallet_mismatches===0?'good':'bad']]);
table(section('Settlement Reasons'),['V2 reason','V3 reason','Candidate outcome','Markets'],(d.settlement_reasons||[]).map(x=>[x.v2_reason,x.v3_reason,x.service_candidate_outcome,num(x.n)]));
const cal=section('Pricing Calibration');cal.append(el('p','Decisive V2 outcomes only; voids are excluded. These figures may be affected by selection bias.','muted'));table(cal,['Probability band','Markets','Mean predicted YES','Observed YES'],(d.calibration_decisive_only||[]).map(x=>[`${x.bucket*10}–${x.bucket*10+10}%`,num(x.n),num(x.predicted_yes_pct)+'%',num(x.observed_yes_pct)+'%']));
}
let client,epoch=0;function hide(message){epoch++;dashboard.hidden=true;metrics.replaceChildren();status.hidden=false;status.textContent=message;}
async function load(){const id=++epoch;$('refresh').disabled=true;$('period').disabled=true;status.hidden=false;status.textContent='Loading founder metrics…';dashboard.hidden=true;metrics.replaceChildren();try{const {data:s,error:authError}=await client.auth.getSession();if(authError||!s.session)throw Error('Sign in to your founder account from the game first.');const {data,error}=await client.rpc('get_founder_engine_health',{p_hours:Number($('period').value)});if(id!==epoch)return;if(error)throw Error(error.code==='42501'?'Founder access required. Sign in using your designated founder account.':'Metrics could not be retrieved. Try refreshing.');render(data);status.hidden=true;dashboard.hidden=false;}catch(e){if(id===epoch)hide(e.message||'Dashboard unavailable.');}finally{if(id===epoch||dashboard.hidden){$('refresh').disabled=false;$('period').disabled=false;}}}
try{const {createClient}=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/+esm');client=createClient('https://jxymdjkzbjntfbbyjdfa.supabase.co','sb_publishable_DA9X9DoNOhoBYFMdVGh7JQ_Rzk_xRPI',{auth:{storageKey:'subway-exchange-live-auth-v1',persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});client.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT'||(event==='SIGNED_IN'&&session))setTimeout(()=>{if(event==='SIGNED_OUT')hide('Signed out. Return to the game to sign in.');else load();},0);});$('refresh').onclick=load;$('period').onchange=load;await load();}catch{hide('Unable to initialize the dashboard. Return to the game and try again.');}
</script></body></html>
